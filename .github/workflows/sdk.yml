name: SDKs

on:
  push:
    branches: [main]
    paths: ['sdk/**', 'server/public/sdk/**', 'Package.swift', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['sdk/**', 'server/public/sdk/**', 'Package.swift', '.github/workflows/sdk.yml']

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/carillon_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Analyze with the lowest allowed dependencies
        run: flutter pub downgrade && flutter analyze --no-fatal-infos
      - name: Ready for pub.dev
        run: flutter pub publish --dry-run

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax of the web SDK
        run: |
          node --check server/public/sdk/carillon.js
          node --check server/public/sdk/carillon-sw.js

  ios-extension:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The extension package builds and can be subclassed
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          mkdir -p build && cd build
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios15.0-simulator -parse-as-library -emit-module -module-name CarillonExtension \
            -emit-module-path CarillonExtension.swiftmodule ../sdk/carillon_flutter/ios/CarillonExtension/Sources/CarillonExtension/CarillonNotificationService.swift
          printf 'import CarillonExtension\nclass NotificationService: CarillonNotificationService {}\n' > App.swift
          xcrun swiftc -sdk "$SDK" -target arm64-apple-ios15.0-simulator -typecheck -I . App.swift

